name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          cache-suffix: py${{ matrix.python-version }}
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Sync deps
        run: uv sync --dev --python ${{ matrix.python-version }}
      - name: Check changelog fragments
        run: uv run python -m towncrier build --draft --version 0.0.0
      - name: Ruff lint
        run: uv run ruff check .
      - name: Mypy type-check
        run: uv run mypy src/
      - name: Pytest (offline)
        run: uv run pytest
